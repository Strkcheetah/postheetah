<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010405"><title>Cheetah Wheels</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
body{background:radial-gradient(900px 500px at 88% -10%,#F7501B1f,transparent),radial-gradient(700px 500px at -5% 105%,#1AB1E612,transparent),#010405;background-attachment:fixed;color:#f1f5f9;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card{background:linear-gradient(180deg,#0f1519,#0a0f12);border:1px solid #1c272e;border-radius:1.1rem;padding:1.1rem;box-shadow:0 10px 24px -14px #000c}
.btn{background:linear-gradient(135deg,#F7501B,#e23d0b);color:#fff;font-weight:600;border-radius:.8rem;padding:.65rem 1.1rem;box-shadow:0 6px 18px -8px #F7501B;transition:.15s}
.btn2{background:#10171c;border:1px solid #223039;color:#e2e8f0;font-weight:500;border-radius:.8rem;padding:.65rem 1.1rem}
.btnr{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;font-weight:600;border-radius:.8rem;padding:.65rem 1.1rem}
.btn:active,.btn2:active,.btnr:active{transform:scale(.97)}
.inp{width:100%;background:#010405;border:1px solid #223039;border-radius:.75rem;padding:.7rem .8rem;color:#f8fafc}
.inp:focus{outline:2px solid #1AB1E6;border-color:transparent}.mut{color:#8e9ba4}
.thumb{object-fit:cover;border-radius:.8rem;background:#010405;border:1px solid #1c272e}
.ph{display:flex;align-items:center;justify-content:center;color:#475569}

#main{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:.9rem;align-content:start}
#main>*{margin:0!important}
#main>:not(.card),#main>.card.full{grid-column:1/-1}
.pos{display:grid;gap:1.25rem}
@media(min-width:1024px){.pos{grid-template-columns:1fr 390px}.pos>.card{position:sticky;top:1rem;align-self:start}}
@media(hover:hover){.card{transition:transform .2s,border-color .2s}.card:hover{border-color:#F7501B66}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes grow{from{width:0}}
#main.anim>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
#main.anim>:nth-child(n+2){animation-delay:.06s}#main.anim>:nth-child(n+4){animation-delay:.12s}#main.anim>:nth-child(n+7){animation-delay:.18s}
#mod>div{animation:fin .2s}#mod>div>.card{animation:pop .28s cubic-bezier(.2,.8,.2,1)}#toast>div{animation:pop .25s}
#loader{transition:opacity .5s,visibility .5s}#loader.off{opacity:0;visibility:hidden}
.bar{height:100%;width:40%;background:linear-gradient(90deg,transparent,#F7501B,transparent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.wh{transform-box:fill-box;transform-origin:center;animation:spin .4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.car{animation:bob .3s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-2px)}}
.road{animation:road .35s linear infinite}@keyframes road{to{stroke-dashoffset:-38}}
.spd{animation:spd .6s linear infinite}@keyframes spd{from{transform:translateX(30px);opacity:0}30%{opacity:.8}to{transform:translateX(-40px);opacity:0}}
.dot{width:8px;height:8px;border-radius:50%;background:#1AB1E6;animation:ping 2s infinite}@keyframes ping{0%{box-shadow:0 0 0 0 #1AB1E6aa}70%,100%{box-shadow:0 0 0 8px #1AB1E600}}
.prog{height:6px;border-radius:9px;background:#010405;overflow:hidden}.prog>i{display:block;height:100%;border-radius:9px;animation:grow 1s ease both}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes flt{50%{transform:translateY(-7px)}}.float{animation:flt 2.2s ease-in-out infinite}</style></head>
<body>
<div id="login" style="display:none" class="min-h-screen items-center justify-center p-6">
 <form onsubmit="login(event)" class="card w-full max-w-sm space-y-3">
  <div class="text-center py-2"><img data-logo class="w-32 h-32 mx-auto -mt-2 object-contain" alt="Cheetah Wheels"><h1 class="text-2xl font-semibold tracking-tight">Cheetah Wheels</h1><p class="mut text-sm">Gestión comercial e inventario</p></div>
  <input id="lu" class="inp" placeholder="Usuario" autocomplete="username">
  <input id="lp" type="password" class="inp" placeholder="Contraseña" autocomplete="current-password">
  <p id="lerr" class="hidden text-rose-400 text-sm">Usuario o contraseña incorrectos.</p>
  <button class="btn w-full">Iniciar sesión</button>
 </form>
</div>
<div id="app" style="display:none">
 <aside class="hidden md:flex fixed inset-y-0 left-0 w-64 bg-black border-r border-[#1c272e] flex-col p-4 gap-1" id="side"></aside>
 <div class="md:pl-64"><main id="main" class="px-4 py-5 md:px-10 md:py-8 pb-28 md:pb-10 max-w-6xl mx-auto"></main></div>
 <nav id="bot" class="md:hidden fixed bottom-0 inset-x-0 bg-black/90 backdrop-blur border-t border-[#1c272e] flex justify-around pt-2" style="padding-bottom:max(.5rem,env(safe-area-inset-bottom))"></nav>
</div>

let _rb;
async function bgRemove(blob){
 if(!_rb){
  const V='@imgly/background-removal@1.4.5',U=['https://esm.sh/'+V,'https://cdn.jsdelivr.net/npm/'+V+'/+esm','https://cdn.jsdelivr.net/npm/'+V+'/dist/index.mjs'];
  let err;
  for(const u of U){try{const m=await import(u),fn=m.removeBackground||m.default;if(typeof fn==='function'){_rb=fn;break}}catch(e){err=e;console.warn('IA: no cargó',u,e)}}
  if(!_rb)throw new Error('No cargó la librería de IA'+(err?' ('+(err.message||err)+')':''));
 }
 const run=model=>_rb(blob,{model,output:{format:'image/png'},progress:(k,c,t)=>{const b=$('enb');if(b&&t>0&&String(k).startsWith('fetch'))b.textContent='Descargando modelo '+Math.round(c/t*100)+'%'}});
 let r;try{r=await run(innerWidth<768?'small':'medium')}catch(e){console.warn('IA: reintento con modelo pequeño',e);r=await run('small')}
 return r&&r.convertToBlob?await r.convertToBlob('image/png'):r;
}
async function whiteSquare(blob){
 const bm=await createImageBitmap(blob),w=bm.width,h=bm.height,c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d');x.drawImage(bm,0,0);const d=x.getImageData(0,0,w,h).data;
 let x0=w,y0=h,x1=0,y1=0;
 for(let y=0;y<h;y++)for(let i=0;i<w;i++)if(d[(y*w+i)*4+3]>20){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
 if(x1<=x0||y1<=y0)throw new Error('vacío');
 const bw=x1-x0+1,bh=y1-y0+1,S=800,k=Math.min(S*.86/bw,S*.86/bh),o=document.createElement('canvas');o.width=o.height=S;
 const g=o.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,S,S);g.imageSmoothingQuality='high';
 g.drawImage(c,x0,y0,bw,bh,(S-bw*k)/2,(S-bh*k)/2,bw*k,bh*k);
 return o.toDataURL('image/jpeg',.9);
}

function addCart(id){
 const p=db.products.find(x=>x.id===id),i=cart.find(x=>x.id===id),n=(i?i.qty:0)+1;
 if(n>p.stock)return toast('Stock insuficiente');
 if(i)i.qty=n;else cart.push({id,name:p.name,qty:1,price:p.price,cost:p.cost});
 render();toast('Agregado: '+p.name);
}
function chg(id,d){const i=cart.find(x=>x.id===id),p=db.products.find(x=>x.id===id);if(i.qty+d>p.stock)return toast('Stock insuficiente');i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);render()}
function scanSell(){
 scan(code=>{
  const p=db.products.find(x=>x.sku===code);
  if(!p)return modal(`<h3 class="font-semibold">Producto no encontrado</h3><p class="mut my-2">Código: ${esc(code)}</p><div class="flex gap-2"><button class="btn2 flex-1" onclick="closeM()">Cerrar</button><button class="btn flex-1" onclick="prodForm('',{sku:'${esc(code)}'})">Crear producto</button></div>`);
  modal(`<div class="flex gap-3">${pic(p,'w-24 h-24 shrink-0')}<div><h3 class="font-semibold text-lg leading-tight">${esc(p.name)}</h3><p class="mut text-sm">${esc(p.sku)} · ${esc(p.cat)}</p><p class="text-sm mt-1 ${p.stock<=LOW?'text-rose-400':'mut'}">${p.stock} en stock</p></div></div>
  <div class="flex justify-between items-end my-4"><span class="text-3xl font-bold text-[#FCEA0D]">${m(p.price)}</span><span class="text-sm text-[#FCEA0D]">Ganancia ${m(p.price-p.cost)}</span></div>
  <div class="flex gap-2"><button class="btn2 flex-1" onclick="scanSell()">Escanear otro</button><button class="btn flex-1" onclick="addCart('${p.id}');closeM()">Agregar al carrito</button></div>`);
 });

function checkout(){
 if(!cart.length)return toast('El carrito está vacío');
 if(pay==='Fiado'&&!cust)return toast('Elige un cliente para fiar');
 const total=cart.reduce((s,i)=>s+i.qty*i.price,0),profit=cart.reduce((s,i)=>s+i.qty*(i.price-i.cost),0),items=cart;
 items.forEach(i=>{db.products.find(x=>x.id===i.id).stock-=i.qty});
 db.sales.push({id:uid(),d:ld(),t:Date.now(),items,total,profit,method:pay,cust});
 if(pay==='Fiado'){const c=db.customers.find(x=>x.id===cust);c.balance+=total;c.hist.push({d:ld(),type:'Crédito (venta)',amount:total})}
 cart=[];save();render();
 modal(`<div class="text-center mb-3"><div class="w-14 h-14 mx-auto rounded-full bg-[#FCEA0D]/10 text-[#FCEA0D] flex items-center justify-center mb-2">${ic('check',28)}</div><h3 class="font-semibold text-lg">Venta registrada</h3><p class="mut text-sm">${esc(pay)}</p></div>
 ${items.map(i=>`<div class="flex justify-between text-sm py-1.5 border-b border-[#26343d]/60"><span>${i.qty} × ${esc(i.name)}</span><span>${m(i.qty*i.price)} <span class="text-[#FCEA0D] ml-1">+${m(i.qty*(i.price-i.cost))}</span></span></div>`).join('')}
 <div class="flex justify-between text-xl font-semibold mt-3"><span>Total</span><span>${m(total)}</span></div>
 <div class="flex justify-between text-lg mt-1"><span class="text-[#FCEA0D]">Ganancia de la venta</span><b class="text-[#FCEA0D]">${m(profit)}</b></div>
 <button class="btn w-full mt-4" onclick="closeM()">Listo</button>`);
}

/* ---------- BAJO PEDIDO ---------- */
const OST=['Por pedir al proveedor','Con el proveedor','En tránsito','En aduana','En mi tienda','Entregado al cliente','Reembolsado'];
const OBG={'Entregado al cliente':'bg-[#FCEA0D]/10 text-[#FCEA0D]','Reembolsado':'bg-slate-500/20 text-slate-300','En mi tienda':'bg-[#1AB1E6]/15 text-[#1AB1E6]'};
const oa=o=>!['Entregado al cliente','Reembolsado'].includes(o.status);
const left=o=>90-Math.floor((Date.now()-new Date(o.d+'T00:00:00'))/864e5);
let ofil='Activos';
function vOrd(){
 const nm=(t,id)=>(ent(t,id)||{}).name||'',act=db.orders.filter(oa);
 const l=db.orders.filter(o=>(o.name+nm('c',o.cust)+nm('s',o.sid)).toLowerCase().includes(q.toLowerCase())&&(ofil==='Todos'||(ofil==='Activos'?oa(o):o.status===ofil))).slice().reverse();
 const cd=(a,b,col='')=>`<div class="card"><div class="mut text-xs mb-1">${a}</div><div class="text-xl font-semibold ${col}">${b}</div></div>`;
 return head('Bajo pedido',`<button class="btn flex items-center gap-1" onclick="ordForm()">${ic('plus',18)} Pedido</button>`)+
 `<div class="grid grid-cols-3 gap-3">${cd('Activos',act.length)}${cd('Valor en pedidos',m(act.reduce((x,o)=>x+o.value,0)),'text-[#FCEA0D]')}${cd('Reembolso ≤7 días',db.orders.filter(o=>o.status!=='Reembolsado'&&left(o)>0&&left(o)<=7).length,'text-rose-400')}</div>
 <div class="flex gap-2 flex-wrap items-center">${[['Activos','Activos'],['Entregado al cliente','Entregados'],['Todos','Todos']].map(([k,t])=>`<button class="px-3 py-1.5 rounded-full text-sm ${ofil===k?'bg-[#F7501B] text-white font-semibold':'btn2 !py-1.5'}" onclick="ofil='${k}';render()">${t}</button>`).join('')}<input class="inp !w-auto flex-1 min-w-[160px]" placeholder="Buscar producto, cliente o proveedor" value="${esc(q)}" onchange="q=this.value;render()"></div>`+
 (l.map(o=>{const dl=left(o),pc=Math.max(0,Math.min(100,dl/90*100)),col=dl<=7?'#fb7185':dl<=30?'#FCEA0D':'#1AB1E6';
 return `<div class="card"><div class="flex gap-3">${pic(o,'w-24 h-24 shrink-0')}<div class="flex-1 min-w-0"><div class="flex justify-between gap-2"><b class="truncate">${esc(o.name)}</b><b class="text-[#FCEA0D] shrink-0">${m(o.value)}</b></div>
 <div class="text-xs mut mt-0.5">Cliente: <span class="text-slate-200">${esc(nm('c',o.cust))||'—'}</span></div><div class="text-xs mut">Proveedor: <span class="text-slate-200">${esc(nm('s',o.sid))||'—'}</span></div>
 ${o.debt?'<span class="inline-block mt-1 px-2 py-0.5 rounded-md text-[11px] bg-rose-500/15 text-rose-400">Cliente lo debe</span>':''}</div></div>
 <div class="mt-3"><div class="mut text-xs mb-1">Dónde está ahora</div><select class="inp !py-1.5 text-sm ${OBG[o.status]||''}" onchange="setSt('${o.id}',this.value)">${so(OST,o.status)}</select>${o.note?`<p class="text-xs mut mt-1">${esc(o.note)}</p>`:''}</div>
 ${o.status==='Reembolsado'?'':`<div class="mt-3"><div class="flex justify-between text-xs mb-1"><span class="mut">Reembolso · registrado ${o.d}</span><b style="color:${col}">${dl>0?dl+' días restantes':'Plazo vencido'}</b></div><div class="prog"><i style="width:${pc}%;background:${col}"></i></div></div>`}
 <div class="flex justify-end gap-4 mt-3 text-xs"><button class="text-[#1AB1E6]" onclick="ordForm('${o.id}')">Editar</button><button class="text-rose-400" onclick="delO('${o.id}')">Eliminar</button></div></div>`}).join('')||empty());
}
function ordDebt(o,sg){const c=ent('c',o.cust);if(!c)return;c.balance=Math.max(0,c.balance+sg*o.value);c.hist.push({d:ld(),type:sg>0?'Pedido':'Pedido anulado',note:o.name,amount:o.value})}
function setSt(id,v){const o=db.orders.find(x=>x.id===id);o.status=v;if(v==='Reembolsado'&&o.debt){ordDebt(o,-1);o.debt=false}save();render();toast('Estado actualizado')}
function ordForm(id){
 if(!db.customers.length)return toast('Primero registra un cliente');
 const o=db.orders.find(x=>x.id===id)||{status:OST[0],debt:true};id=id||'';window._img=o.img||'';
 const op=(a,v)=>a.map(x=>`<option value="${x.id}" ${x.id===v?'selected':''}>${esc(x.name)}</option>`).join('');
 modal(`<h3 class="font-semibold text-lg mb-3">${id?'Editar':'Nuevo'} pedido</h3><div class="space-y-2">
 <label class="flex items-center gap-3 cursor-pointer"><span id="pv">${pic({img:window._img},'w-20 h-20')}</span><span class="btn2 flex items-center gap-2">${ic('camera',18)} Foto del producto</span><input type="file" accept="image/*" class="hidden" onchange="pickImg(this)"></label>
 <button type="button" id="enb" class="btn2 w-full flex items-center justify-center gap-2 !py-2.5 text-sm" onclick="enh()">${ic('image',18)} Mejorar foto con IA (fondo blanco)</button><div id="cmp"></div>
 <input id="on" class="inp" placeholder="Producto que encargó" value="${esc(o.name)}">
 <select id="oc" class="inp"><option value="">Cliente</option>${op(db.customers,o.cust)}</select>
 <select id="os" class="inp"><option value="">Proveedor (opcional)</option>${op(db.suppliers,o.sid)}</select>
 <input id="ov" type="number" step="0.01" class="inp" placeholder="Valor del producto" value="${o.value??''}">
 <select id="ost" class="inp">${so(OST,o.status)}</select>
 <input id="ono" class="inp" placeholder="Detalle de ubicación o tracking (opcional)" value="${esc(o.note)}">
 <label class="flex items-center gap-2 text-sm"><input id="od" type="checkbox" class="w-5 h-5 accent-[#F7501B]" ${o.debt?'checked':''}> El cliente lo debe (sumar a su deuda)</label>
 ${id?'':'<p class="text-xs mut">El plazo de reembolso de 90 días empieza hoy.</p>'}
 <div class="flex gap-2 pt-2"><button class="btn2 flex-1" onclick="closeM()">Cancelar</button><button class="btn flex-1" onclick="saveO('${id}')">Guardar</button></div></div>`);
}
async function saveO(id){
 const d={name:$('on').value.trim(),cust:$('oc').value,sid:$('os').value,value:+$('ov').value||0,status:$('ost').value,note:$('ono').value.trim(),debt:$('od').checked,img:window._img||''};
 if(!d.name)return toast('Escribe el producto');if(!d.cust)return toast('Elige el cliente');
 if(d.status==='Reembolsado')d.debt=false;
 const o=id?db.orders.find(x=>x.id===id):null,old=o?{...o}:null;
 if(d.img.startsWith('data:')){toast('Subiendo foto...');const u=await upImg(d.img);if(u){if(old&&old.img)rmImg(old.img);d.img=u}else d.img=old?old.img:''}
 const same=old&&old.debt&&d.debt&&old.cust===d.cust&&old.value===d.value;
 if(old&&old.debt&&!same)ordDebt(old,-1);
 let n=o;if(o)Object.assign(o,d);else{n={id:uid(),d:ld(),...d};db.orders.push(n)}
 if(n.debt&&!same)ordDebt(n,1);
 save();closeM();render();toast('Pedido guardado');
}
function delO(id){
 const o=db.orders.find(x=>x.id===id);
 if(!confirm('¿Eliminar el pedido?'+(o.debt?' También se quitará su valor de la deuda del cliente.':'')))return;
 if(o.debt)ordDebt(o,-1);rmImg(o.img);db.orders=db.orders.filter(x=>x.id!==id);save();render();toast('Pedido eliminado');
}

const cusForm=()=>entForm('c'),supForm=()=>entForm('s');
function entForm(t,id){
 const e=ent(t,id)||{},sp_=t==='s';
 modal(`<h3 class="font-semibold text-lg mb-3">${id?'Editar':'Nuevo'} ${sp_?'proveedor':'cliente'}</h3><div class="space-y-2">
 <input id="en" class="inp" placeholder="Nombre" value="${esc(e.name)}"><input id="ep" class="inp" placeholder="Teléfono" value="${esc(e.phone)}">
 ${sp_?`<input id="ec" class="inp" placeholder="Empresa" value="${esc(e.company)}"><input id="es" class="inp" placeholder="Productos que suministra" value="${esc(e.supplies)}">`:''}
 ${id?`<label class="mut text-xs">${sp_?'Saldo que les debo':'Saldo que me debe'}</label><input id="eb" type="number" step="0.01" class="inp" value="${e.balance}">`:''}
 <div class="flex gap-2 pt-2">${id?`<button class="btnr" onclick="delE('${t}','${id}')">Eliminar</button>`:''}<button class="btn2 flex-1" onclick="closeM()">Cancelar</button><button class="btn flex-1" onclick="saveE('${t}','${id||''}')">Guardar</button></div></div>`);
}
function saveE(t,id){
 const n=$('en').value.trim();if(!n)return toast('Escribe el nombre');
 const d={name:n,phone:$('ep').value.trim()};if(t==='s'){d.company=$('ec').value.trim();d.supplies=$('es').value.trim()}
 if(id){const e=ent(t,id);if($('eb')){d.balance=+$('eb').value||0;if(d.balance!==e.balance)e.hist.push({d:ld(),type:'Ajuste de saldo',amount:d.balance-e.balance})}Object.assign(e,d)}
 else(t==='c'?db.customers:db.suppliers).push({id:uid(),balance:0,hist:[],...d});
 save();closeM();render();toast('Guardado');
}
function delE(t,id){
 if(!confirm('¿Eliminar? También se borrará su historial.'))return;
 const k=t==='c'?'customers':'suppliers';db[k]=db[k].filter(x=>x.id!==id);if(t==='s')db.purchases=db.purchases.filter(p=>p.sid!==id);
 save();closeM();render();toast('Eliminado');
}
const ent=(t,id)=>(t==='c'?db.customers:db.suppliers).find(x=>x.id===id);
function mvForm(t,id,k){
 const e=ent(t,id),ab=k==='abono';
 modal(`<h3 class="font-bold text-lg">${ab?(t==='c'?'Abono de ':'Pago a ')+esc(e.name):'Fiar a '+esc(e.name)}</h3><p class="mut text-sm mb-2">Saldo actual: ${m(e.balance)}</p><div class="space-y-2">
 <input id="ma" type="number" step="0.01" class="inp" placeholder="Monto"><select id="mm" class="inp">${opts(METHODS)}</select><input id="mn" class="inp" placeholder="Nota (opcional)">
 <div class="flex gap-2"><button class="btn2 flex-1" onclick="closeM()">Cancelar</button><button class="btn flex-1" onclick="doMv('${t}','${id}','${k}')">Confirmar</button></div></div>`);
}
function doMv(t,id,k){
 const e=ent(t,id);let a=+$('ma').value;if(!(a>0))return toast('Monto inválido');
 const meth=$('mm').value,note=$('mn').value.trim();
 if(k==='abono'){a=Math.min(a,e.balance);if(a<=0)return toast('No hay deuda pendiente');e.balance-=a;e.hist.push({d:ld(),type:'Abono',amount:a,note});
  db.tx.push({id:uid(),d:ld(),type:t==='c'?'in':'out',amount:a,cat:t==='c'?'Abono cliente':'Pago proveedor',method:meth,note:e.name})}
 else{e.balance+=a;e.hist.push({d:ld(),type:'Crédito',amount:a,note})}
 save();closeM();render();toast('Registrado');
}
function hist(t,id){
 const e=ent(t,id),pu=t==='s'?db.purchases.filter(p=>p.sid===id).slice().reverse():[];
 modal(`<h3 class="font-semibold text-lg mb-2">Historial: ${esc(e.name)}</h3>${t==='s'?`<b class="text-sm">Compras</b>`+(pu.map(p=>`<div class="flex justify-between items-center py-2 border-b border-[#26343d]/60 text-sm"><span>${p.d} · ${p.lines.length} prod. <span class="mut">(pagado ${m(p.paid)})</span></span><span><b>${m(p.total)}</b> <button class="text-rose-400 ml-2" onclick="delPurch('${p.id}')">Eliminar</button></span></div>`).join('')||'<p class="mut text-sm py-2">Sin compras.</p>')+'<b class="text-sm block mt-3">Movimientos de saldo</b>':''}
 ${e.hist.slice().reverse().map(h=>`<div class="flex justify-between py-2 border-b border-[#26343d]/60 text-sm"><span>${h.d} · ${esc(h.type)} <span class="mut">${esc(h.note)}</span></span><b>${m(h.amount)}</b></div>`).join('')||empty()}<button class="btn2 w-full mt-3" onclick="closeM()">Cerrar</button>`);
}
function delPurch(id){
 const p=db.purchases.find(x=>x.id===id);if(!confirm('¿Eliminar la compra? Se restará el stock y la deuda asociada.'))return;
 p.lines.forEach(l=>{const q=db.products.find(x=>x.id===l.pid);if(q)q.stock=Math.max(0,q.stock-l.qty)});
 const sp_=ent('s',p.sid);if(sp_)sp_.balance=Math.max(0,sp_.balance-(p.total-p.paid));
 db.purchases=db.purchases.filter(x=>x.id!==id);db.tx=db.tx.filter(x=>x.ref!==id);save();closeM();render();toast('Compra eliminada');
}

 <div class="flex gap-2"><button class="btn2 flex-1" onclick="closeM()">Cancelar</button><button class="btn flex-1" onclick="confP()">Confirmar compra</button></div>`);
}
function addL(){const qty=+$('lq').value,cost=+$('lc').value;if(!(qty>0)||!(cost>=0)||$('lc').value==='')return toast('Cantidad y costo requeridos');P.lines.push({pid:$('lp2').value,qty,cost});drawP()}
function confP(){
 if(!P.lines.length)return toast('Agrega productos');
 const s=ent('s',P.sid),total=P.lines.reduce((a,l)=>a+l.qty*l.cost,0);
 const paid=P.type==='Contado'?total:Math.min(+($('pd')?.value)||0,total);
 P.lines.forEach(l=>{const p=db.products.find(x=>x.id===l.pid);p.stock+=l.qty;p.cost=l.cost});
 s.balance+=total-paid;s.hist.push({d:ld(),type:'Compra '+P.type.toLowerCase(),amount:total,note:'Pagado '+m(paid)});
 const pid=uid();db.purchases.push({id:pid,d:ld(),sid:P.sid,lines:P.lines,total,paid});
 if(paid>0)db.tx.push({id:uid(),ref:pid,d:ld(),type:'out',amount:paid,cat:'Compra de mercancía',method:'Efectivo',note:s.name});
 save();closeM();render();toast('Compra registrada, stock actualizado');
}

/* ---------- CAJA Y RESPALDO ---------- */
const so=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
function vCash(){
 const d=ld(),t=db.tx.filter(x=>x.d===d),i=t.filter(x=>x.type==='in').reduce((s,x)=>s+x.amount,0),o=t.filter(x=>x.type==='out').reduce((s,x)=>s+x.amount,0);
 return head('Caja diaria')+`<div class="grid grid-cols-2 gap-3 mb-3"><div class="card"><div class="mut text-xs">Ingresos hoy</div><b class="text-[#FCEA0D] text-lg">${m(i)}</b></div><div class="card"><div class="mut text-xs">Egresos hoy</div><b class="text-rose-400 text-lg">${m(o)}</b></div></div>
 <div class="grid grid-cols-2 gap-3 mb-5"><button class="btn" onclick="txForm('in')">+ Ingreso</button><button class="btnr" onclick="txForm('out')">+ Gasto</button></div>
 <h3 class="font-semibold mb-2">Movimientos</h3>${db.tx.slice().reverse().slice(0,30).map(x=>`<div class="card mb-2 flex justify-between items-center text-sm"><div><b>${esc(x.cat)}</b><div class="mut">${x.d} · ${esc(x.method)} ${esc(x.note)}</div></div><div class="text-right"><b class="${x.type==='in'?'text-[#FCEA0D]':'text-rose-400'}">${x.type==='in'?'+':'−'}${m(x.amount)}</b><div class="flex gap-3 justify-end mt-1 text-xs"><button class="text-[#1AB1E6]" onclick="txForm('${x.type}','${x.id}')">Editar</button><button class="text-rose-400" onclick="delTx('${x.id}')">Eliminar</button></div></div></div>`).join('')||empty()}
 <h3 class="font-semibold mt-5 mb-2">Ventas</h3>${db.sales.slice().reverse().slice(0,30).map(x=>`<div class="card mb-2 flex justify-between items-center text-sm"><div><b>${m(x.total)}</b> <span class="text-[#FCEA0D]">+${m(sp(x))}</span><div class="mut">${x.d} · ${esc(x.method)} · ${x.items.reduce((a,i)=>a+i.qty,0)} uds</div></div><button class="text-rose-400 text-xs" onclick="delSale('${x.id}')">Eliminar</button></div>`).join('')||empty()}
 <div class="card mt-5 space-y-2"><b>Respaldo de datos</b><p id="st" class="mut text-xs"></p><div class="grid grid-cols-2 gap-2"><button class="btn" onclick="exportDB()">Exportar respaldo</button><button class="btn2" onclick="$('imp').click()">Importar respaldo</button></div>
 <input id="imp" type="file" accept="application/json" class="hidden" onchange="importDB(this)"><button class="btnr w-full" onclick="logout()">Cerrar sesión</button></div>`;
}
function est(){const el=$('st');if(el)el.textContent='Datos sincronizados en la nube (Supabase) entre todos tus dispositivos.'}
function txForm(type,id){
 const e=db.tx.find(x=>x.id===id)||{},cats=[...new Set([...(type==='in'?['Venta libre','Servicio','Otros ingresos']:['Alquiler','Servicios','Transporte','Nómina','Mercancía','Otros gastos']),...(e.cat?[e.cat]:[])])];
 modal(`<h3 class="font-semibold text-lg mb-3">${id?'Editar':'Nuevo'} ${type==='in'?'ingreso':'gasto'}</h3><div class="space-y-2"><input id="ta" type="number" step="0.01" class="inp" placeholder="Monto" value="${e.amount??''}">
 <select id="tc" class="inp">${so(cats,e.cat)}</select><select id="tm" class="inp">${so(METHODS,e.method)}</select><input id="tn" class="inp" placeholder="Nota (opcional)" value="${esc(e.note)}">
 <div class="flex gap-2"><button class="btn2 flex-1" onclick="closeM()">Cancelar</button><button class="btn flex-1" onclick="saveTx('${type}','${id||''}')">Guardar</button></div></div>`);
}
function saveTx(type,id){const a=+$('ta').value;if(!(a>0))return toast('Monto inválido');const d={amount:a,cat:$('tc').value,method:$('tm').value,note:$('tn').value.trim()};if(id)Object.assign(db.tx.find(x=>x.id===id),d);else db.tx.push({id:uid(),d:ld(),type,...d});save();closeM();render();toast('Guardado')}
function delTx(id){if(confirm('¿Eliminar este movimiento?')){db.tx=db.tx.filter(x=>x.id!==id);save();render()}}
function delSale(id){
 const x=db.sales.find(v=>v.id===id);if(!confirm('¿Eliminar la venta y devolver las unidades al stock?'))return;
 x.items.forEach(i=>{const p=db.products.find(v=>v.id===i.id);if(p)p.stock+=i.qty});
 if(x.method==='Fiado'){const c=db.customers.find(v=>v.id===x.cust);if(c){c.balance=Math.max(0,c.balance-x.total);c.hist.push({d:ld(),type:'Venta anulada',amount:x.total})}}
 db.sales=db.sales.filter(v=>v.id!==id);save();render();toast('Venta eliminada');
}
function exportDB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='cheetah-wheels-respaldo-'+ld()+'.json';a.click()}
function importDB(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.sales||!d.customers||!d.suppliers)throw 0;
  if(!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?'))return;
  setDB(d).then(()=>{render();toast('Respaldo importado')})}catch(e){toast('Archivo de respaldo inválido')}};
 r.readAsText(f);
}
/* ---------- NUBE (Supabase) ---------- */
const last=new Map(),fail=e=>toast('Error de sincronización: '+(e.message||'sin conexión'));let qq=Promise.resolve();
function save(){
 const up=[],seen=new Set();
 COLS.forEach(c=>db[c].forEach(x=>{const k=c+'|'+x.id;seen.add(k);const j=JSON.stringify(x);if(last.get(k)!==j){last.set(k,j);up.push({col:c,id:x.id,data:x})}}));
 const del=[...last.keys()].filter(k=>!seen.has(k));del.forEach(k=>last.delete(k));
 qq=qq.then(async()=>{
  for(let i=0;i<up.length;i+=200){const {error}=await sb.from('records').upsert(up.slice(i,i+200),{onConflict:'col,id'});if(error){up.slice(i).forEach(r=>last.delete(r.col+'|'+r.id));return fail(error)}}
  for(const k of del){const [c,id]=k.split('|'),{error}=await sb.from('records').delete().eq('col',c).eq('id',id);if(error){last.set(k,'?');fail(error)}}
 });
}
async function loadAll(){
 COLS.forEach(c=>db[c]=[]);last.clear();
 for(let a=0;;a+=1000){
  const {data,error}=await sb.from('records').select('col,id,data').order('seq').range(a,a+999);
  if(error){fail(error);break}
  data.forEach(r=>{if(db[r.col]){db[r.col].push(r.data);last.set(r.col+'|'+r.id,JSON.stringify(r.data))}});
  if(data.length<1000)break;
 }
}
function applyRemote(p){
 const c=(p.new&&p.new.col)||(p.old&&p.old.col),id=(p.new&&p.new.id)||(p.old&&p.old.id);if(!COLS.includes(c))return;
 const arr=db[c],k=c+'|'+id,i=arr.findIndex(x=>x.id===id);
 if(p.eventType==='DELETE'){if(i>=0)arr.splice(i,1);last.delete(k)}
 else{const j=JSON.stringify(p.new.data);if(last.get(k)===j)return;last.set(k,j);if(i>=0)arr[i]=p.new.data;else arr.push(p.new.data)}
 render();
}
function subscribe(){if(subscribed)return;subscribed=true;sb.channel('cw').on('postgres_changes',{event:'*',schema:'public',table:'records'},applyRemote).subscribe()}
async function upImg(du){
 try{const b=await (await fetch(du)).blob(),p=uid()+'.jpg',{error}=await sb.storage.from('fotos').upload(p,b,{contentType:'image/jpeg'});if(error)throw error;return sb.storage.from('fotos').getPublicUrl(p).data.publicUrl}
 catch(e){toast('No se pudo subir la foto');return null}
}
function rmImg(u){const p=(u||'').split('/fotos/')[1];if(p)sb.storage.from('fotos').remove([p])}
async function setDB(d){
 loader(true,'Subiendo datos');
 for(const p of d.products||[])if(p.img&&p.img.startsWith('data:'))p.img=(await upImg(p.img))||'';
 await qq;await sb.from('records').delete().neq('id','');last.clear();
 db=Object.fromEntries(COLS.map(c=>[c,d[c]||[]]));save();await qq;loader(false);
}
function localData(){return new Promise(ok=>{
 const r=indexedDB.open('cheetah_wheels');r.onupgradeneeded=()=>r.transaction.abort();r.onerror=()=>ok(null);
 r.onsuccess=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv')||!d.objectStoreNames.contains('imgs')){d.close();return ok(null)}
  const t=d.transaction(['kv','imgs']),a=t.objectStore('kv'),b=t.objectStore('imgs'),ak=a.getAllKeys(),av=a.getAll(),bk=b.getAllKeys(),bv=b.getAll();
  t.oncomplete=()=>{const o={},im={};ak.result.forEach((k,i)=>o[k]=av.result[i]);bk.result.forEach((k,i)=>im[k]=bv.result[i]);(o.products||[]).forEach(p=>p.img=im[p.id]||'');d.close();ok(o)};t.onerror=()=>ok(null)}
})}
function init(){
 if(!SUPABASE_URL.startsWith('https://')||SUPABASE_KEY.length<30){
  document.body.innerHTML='<div class="p-6 max-w-lg mx-auto"><div class="card"><h2 class="text-xl font-semibold mb-2">Falta conectar la nube</h2><p class="mut text-sm">Abre index.html y pega tu Project URL y tu anon key de Supabase en las constantes SUPABASE_URL y SUPABASE_KEY, al inicio del script.</p></div></div>';return}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('app').style.display==='block')qq.then(loadAll).then(render)});
 boot();
}
init();
</script></body></html>
